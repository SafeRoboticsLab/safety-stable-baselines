site_name: safety-stable-baselines
site_description: Train RL policies that stay safe, reach goals safely, and resist disturbances — safety, reach-avoid, and adversarial safety RL on Stable-Baselines3.
repo_url: https://github.com/SafeRoboticsLab/safety-stable-baselines
repo_name: SafeRoboticsLab/safety-stable-baselines
edit_uri: edit/main/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  log/
  website_audit.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: sphinx
            show_source: true
            show_root_heading: true
            members_order: source
            separate_signature: true

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - tables
  - toc: { permalink: true }
  - pymdownx.snippets: { base_path: [.] }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Choose a learner: getting-started/choose-a-learner.md
  - Core concepts:
      - Safety margins & certificates: concepts/safety-margins.md
      - The environment contract: concepts/environment-contract.md
      - The MAP convention: map.md
      - Backups & terminal handling: concepts/backups.md
  - How-to guides:
      - Adapt a Gymnasium environment: how-to/adapt-environment.md
      - Train an adversarial policy: how-to/train-adversarial.md
      - Evaluate a policy: how-to/evaluate.md
      - Deploy a safety filter: how-to/deploy-filter.md
  - Examples:
      - Overview: environments/index.md
      - Bicycle5D: environments/bicycle5d.md
  - Training guide:
      - Hyperparameters: hyperparameters.md
      - Best practices: best-practices.md
  - Validation & theory:
      - Oracle validation: validation-oracle.md
  - API reference: reference.md
  - Project:
      - Release notes: release-notes.md
